<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0E0E0E" />
    <title>Pas de connexion — Afrique Business</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #0E0E0E;
        color: #F8FAFC;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 420px;
        width: 100%;
        background: #141418;
        border: 1px solid #27272A;
        border-radius: 24px;
        padding: 36px 24px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      }
      .logo-box {
        width: 88px;
        height: 88px;
        margin: 0 auto 20px;
        border-radius: 20px;
        overflow: hidden;
        border: 2px solid rgba(212, 175, 55, 0.4);
        background: #000;
        box-shadow: 0 10px 25px rgba(212, 175, 55, 0.15);
      }
      .logo-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .offline-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        border-radius: 9999px;
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: #F87171;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 16px;
      }
      .pulse-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #EF4444;
        animation: pulse 1.8s infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
      h1 {
        font-size: 22px;
        font-weight: 900;
        letter-spacing: -0.02em;
        margin-bottom: 8px;
        color: #FFFFFF;
      }
      h1 span {
        color: #D4AF37;
      }
      p {
        font-size: 13px;
        line-height: 1.6;
        color: #94A3B8;
        margin-bottom: 28px;
      }
      .btn-retry {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        padding: 14px 20px;
        border-radius: 14px;
        background: linear-gradient(135deg, #D4AF37 0%, #F59E0B 100%);
        color: #0E0E0E;
        font-size: 14px;
        font-weight: 800;
        border: none;
        cursor: pointer;
        transition: transform 0.15s ease, filter 0.15s ease;
        box-shadow: 0 10px 25px -5px rgba(212, 175, 55, 0.3);
        min-height: 48px;
      }
      .btn-retry:hover {
        filter: brightness(1.08);
      }
      .btn-retry:active {
        transform: scale(0.98);
      }
      .hint {
        font-size: 11px;
        color: #64748B;
        margin-top: 18px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo-box">
        <img src="/pwa-192x192.png" alt="Afrique Business Logo" />
      </div>

      <div class="offline-badge">
        <span class="pulse-dot"></span>
        Mode Hors Ligne
      </div>

      <h1>Pas de connexion, <span>réessaie</span></h1>
      <p>
        Votre appareil semble déconnecté d'Internet. Vérifiez votre connexion mobile (3G/4G/5G) ou votre réseau Wi-Fi pour continuer à naviguer sur Afrique Business.
      </p>

      <button class="btn-retry" onclick="window.location.reload()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
        </svg>
        <span>Réessayer</span>
      </button>

      <div class="hint">
        Afrique Business — Tout l'Afrique, un seul marché
      </div>
    </div>
  </body>
</html>
