<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="100%" height="100%">
  <!-- Obsidian Black Background with Gold Border -->
  <rect width="192" height="192" rx="40" fill="#0E0E0E"/>
  <rect x="2" y="2" width="188" height="188" rx="38" fill="none" stroke="#D4AF37" stroke-width="3" stroke-opacity="0.4"/>
  <g transform="translate(42, 28) scale(1.15)">
    <!-- African continent outline shaped as a stylish shopping bag -->
    <path d="M48 20 C76 20, 84 35, 92 48 C98 60, 90 82, 72 96 C62 104, 52 110, 44 105 C34 100, 16 68, 20 45 C24 28, 30 20, 48 20 Z" fill="#D4AF37" fill-opacity="0.95"/>
    <!-- Inner bag fold detail -->
    <path d="M48 20 C60 20, 78 30, 82 48 C68 46, 52 46, 36 46 C32 30, 38 20, 48 20 Z" fill="#F59E0B" fill-opacity="0.9"/>
    <!-- Bag Handle that arches up to form a GPS Map Pin / Location Pointer -->
    <path d="M46 2 C32 2, 28 16, 28 26 C38 26, 48 26, 58 26 C58 16, 54 2, 46 2 Z" stroke="#FFD700" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Location Pin Golden Core -->
    <circle cx="46" cy="14" r="4.5" fill="#FFFFFF"/>
  </g>
</svg>
